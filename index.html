<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hello World</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        line-height: 1.5;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        background: #f6f7f9;
        color: #171717;
      }

      main {
        width: min(92vw, 720px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(42px, 8vw, 88px);
        font-weight: 750;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        color: #5f6368;
        font-size: 18px;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #101114;
          color: #f4f4f5;
        }

        p {
          color: #a1a1aa;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Hello World</h1>
      <p>Deployed with Vercel.</p>
    </main>
  </body>
</html>
